name: Install Node.js LTS
on:
  workflow_dispatch:

jobs:
  test-setup-node-lts:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - lts/jod
          - lts/krypton
          - lts/lithium
          - lts/*
        latest:
          - 'false'
          - 'true'
    name: Node.js ${{ matrix.node }} check-latest:(${{ matrix.latest }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js LTS variant
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ matrix.latest }}
      - run: node --version
