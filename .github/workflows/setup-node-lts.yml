name: Install Node.js LTS
on:
  workflow_dispatch:

jobs:
  test-setup-node-lts:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - lts/jod
          - lts/krypton
          - lts/lithium
          - lts/*
    name: Node.js ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: node --version
