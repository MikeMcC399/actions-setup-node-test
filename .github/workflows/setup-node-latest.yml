name: Install Node.js latest
on:
  workflow_dispatch:

jobs:
  test-setup-node-latest:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - current
          - latest
          - node
          - '*'
        latest:
          - 'false'
          - 'true'
    name: Node.js ${{ matrix.node }} check-latest:(${{ matrix.latest }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ matrix.latest }}
      - run: node --version
