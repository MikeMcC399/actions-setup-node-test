name: Install Node.js latest
on:
  workflow_dispatch:

jobs:
  test-setup-node-latest:
    runs-on: ubuntu-26.04
    name: Node.js latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js latest
        uses: actions/setup-node@v7.1.0
        with:
          node-version: latest
          check-latest: true
      - run: node --version
